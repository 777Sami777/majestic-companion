<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dziś</title>
<link rel="stylesheet" href="../common.css">
<style>
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{padding:16px 18px;border-radius:6px;background:var(--bg-2);border:1px solid var(--line-2);cursor:pointer;text-align:left;transition:border-color .15s,background .15s}
.kpi:hover{border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:var(--card)}
.kpi label{display:block;font:600 12px var(--display);letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);cursor:inherit}
.kpi b{display:block;margin:8px 0 4px;font:700 30px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.kpi small{color:var(--text-2)}
.kpi.good b{color:var(--good)}.kpi.bad b{color:var(--bad)}
.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;align-items:start}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rows li:last-child{border-bottom:0}
.rows time,.rows .v{font:600 15px var(--display);font-variant-numeric:tabular-nums}
.rows .v{color:var(--accent)}
.rows small{display:block;color:var(--text-3)}
.notes li{grid-template-columns:1fr auto}
.notes p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.x{width:30px;height:30px;border-radius:4px;display:grid;place-items:center;color:var(--text-3)}
.x:hover{background:rgba(239,68,68,.14);color:#fca5a5}
.muted{color:var(--text-3);padding:6px 0}
.goal{margin-bottom:14px}.goal:last-child{margin-bottom:0}
.goal-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.goal-top b{font:600 15px var(--display);font-variant-numeric:tabular-nums}
.goal-top small{color:var(--text-3)}
.gbar{height:8px;border-radius:4px;background:rgba(var(--fg-rgb),.08);overflow:hidden}
.gbar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .6s var(--ease)}
.goal.done .gbar i{background:var(--good)}
.goal.done .goal-top b{color:var(--good)}
.todo{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:4px}
.todo label{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:4px;background:var(--card);cursor:pointer}
.todo input{width:17px;height:17px}
.todo .done span{text-decoration:line-through;color:var(--text-3)}
.todo button{width:26px;height:26px;border-radius:4px;color:var(--text-3);display:grid;place-items:center}
.todo button:hover{color:#fca5a5}
.todo-add{display:grid;grid-template-columns:1fr auto;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--accent))}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:1fr}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal b{font-size:11px;color:var(--text-3);text-align:center;font-weight:600}
.cd{position:relative;min-height:46px;padding:4px 6px;border-radius:5px;background:var(--card);border:1px solid var(--line);font-size:12px}.cd i{font-style:normal;color:var(--text-2)}
.cd.pl{border-color:color-mix(in srgb,var(--accent) 45%,transparent)}.cd.now{outline:2px solid var(--accent)}.cd small{display:block;font-weight:700}.cd .g{color:#22c55e}.cd .r{color:#ef4444}
.cd em{position:absolute;top:3px;right:5px;font-style:normal;font-size:10px;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:0 5px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero rise"><div><h1>Dziś</h1><p class="sub" id="date"></p></div>
    <button class="btn" id="note-btn"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>Szybka notatka <kbd>Ctrl+Shift+N</kbd></button></div>
  <div class="kpis rise" style="--d:1">
    <button class="kpi" data-go="sesje"><label>Czas gry dziś</label><b id="k-time">—</b><small id="k-time-s">z logów Majestic</small></button>
    <button class="kpi" data-go="zarobki" id="k-money-box"><label>Na czysto dziś</label><b id="k-money">—</b><small id="k-money-s">zarobki minus wydatki</small></button>
    <button class="kpi" data-go="minutniki"><label>Minutniki</label><b id="k-timers">0</b><small id="k-timers-s">aktywne</small></button>
    <button class="kpi" data-go="sesje"><label>Gracze na serwerze</label><b id="k-players">—</b><small id="k-players-s">ładowanie…</small></button>
  </div>
  <div class="cols">
    <div class="grid">
      <section class="panel rise" style="--d:2"><h2>Najbliższe minutniki</h2><ul class="rows" id="timers"></ul></section>
      <section class="panel rise" style="--d:3"><h2>Grafik ekipy</h2><ul class="rows" id="events"></ul></section>
      <section class="panel rise" style="--d:3"><h2>Cele tygodnia <button class="btn ghost small" id="rep-img" type="button">Raport jako obrazek</button></h2><div id="goals"></div></section>
      <section class="panel rise" style="--d:3"><h2>Zadania na dziś <span id="todo-count"></span></h2>
        <ul class="todo" id="todo"></ul>
        <form id="todo-add" class="todo-add" autocomplete="off"><input name="t" maxlength="60" placeholder="Dodaj stałe zadanie, np. Skrytka kontrabandy" aria-label="Nowe zadanie"><button class="btn small">Dodaj</button></form>
      </section>
    </div>
    <div class="grid">
      <section class="panel rise" style="--d:4"><h2>Kalendarz <span id="cal-m"></span> <button class="btn ghost small" id="cal-p" type="button" aria-label="Poprzedni miesiąc">‹</button><button class="btn ghost small" id="cal-n" type="button" aria-label="Następny miesiąc">›</button></h2><div class="cal" id="cal"></div></section>
      <section class="panel rise" style="--d:4"><h2>Notatki <span id="n-count"></span></h2><ul class="rows notes" id="notes"></ul></section>
      <section class="panel rise" style="--d:5"><h2>Aktualizacje i eventy Majestic</h2><ul class="rows" id="news"><li class="muted">Ładowanie…</li></ul></section>
    </div>
  </div>
</div>
<script src="../bridge.js"></script>
<script src="../common.js"></script>
<script>
(() => {
"use strict";
const { $, esc, money } = U;
const DAY = 86400000;
const dayStart = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const dur = (sec) => { const m = Math.round(sec / 60); return m >= 60 ? `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m` : `${m} min`; };
const left = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return h ? `${h}h ${String(m).padStart(2, "0")}m` : `${m}:${String(s % 60).padStart(2, "0")}`; };
const xIcon = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
let sessions = null, live = null, myServer = "pl1";

function renderFast() {
  const now = Date.now(), today = dayStart(now);
  $("#date").textContent = new Date().toLocaleDateString("pl-PL", { weekday: "long", day: "numeric", month: "long" });
  const timers = U.load("majestic-minutniki-v1", []).filter((t) => t.end > now).sort((a, b) => a.end - b.end);
  $("#k-timers").textContent = timers.length;
  $("#k-timers-s").textContent = timers[0] ? `najbliższy: ${timers[0].name} za ${left(timers[0].end - now)}` : "brak aktywnych";
  $("#timers").innerHTML = timers.slice(0, 5).map((t) => `<li><i class="dot" style="--c:${t.c || "var(--accent)"}"></i><span>${esc(t.name)}</span><span class="v">${left(t.end - now)}</span></li>`).join("") || `<li class="muted">Brak aktywnych minutników.</li>`;
  const earn = U.load("majestic-zarobki-v1", []).filter((l) => l.at >= today);
  const net = earn.reduce((a, l) => a + l.amt, 0), spent = earn.filter((l) => l.amt < 0).reduce((a, l) => a - l.amt, 0);
  $("#k-money").textContent = earn.length ? money(net) : "—";
  $("#k-money-box").className = "kpi " + (earn.length ? (net >= 0 ? "good" : "bad") : "");
  $("#k-money-s").textContent = earn.length ? `wydatki: ${money(spent)}` : "brak wpisów dzisiaj";
  const ev = (U.load("majestic-ekipa-v1", { events: [] }).events || []).filter((e) => e.at > now).sort((a, b) => a.at - b.at).slice(0, 4);
  $("#events").innerHTML = ev.map((e) => `<li><time>${new Date(e.at).toLocaleTimeString("pl-PL", { hour: "2-digit", minute: "2-digit" })}</time><span>${esc(e.title)}<small>${dayStart(e.at) === today ? "dzisiaj" : new Date(e.at).toLocaleDateString("pl-PL", { weekday: "long", day: "numeric", month: "short" })}</small></span><span></span></li>`).join("") || `<li class="muted">Nic zaplanowanego. Dodaj akcję w zakładce Ekipa.</li>`;
}
// notatki osobno: odświeżanie co sekundę zabierałoby fokus i hover z przycisków
function renderNotes() {
  const notes = U.load("majestic-notatki-v1", []).slice().reverse();
  $("#n-count").textContent = notes.length || "";
  $("#notes").innerHTML = notes.slice(0, 30).map((n) => `<li><div><p>${esc(n.t)}</p><small>${new Date(n.at).toLocaleString("pl-PL", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}</small></div><button class="x" data-del="${n.id}" title="Usuń notatkę" aria-label="Usuń notatkę">${xIcon}</button></li>`).join("") || `<li class="muted">Brak notatek. W grze naciśnij Ctrl+Shift+N, żeby szybko coś zapisać.</li>`;
}
/* zadania dnia: stała lista, odhaczenia kasują się o północy */
const TKEY = "majestic-zadania-v1";
function todoState() {
  const d = U.load(TKEY, null) || { items: ["PayDay odebrany", "Zbieranie (kraby / glony)", "Skrytka kontrabandy", "Opłacić dom", "Sprawdzić grafik ekipy"], done: [], day: "" };
  const today = new Date().toDateString();
  if (d.day !== today) { d.day = today; d.done = []; U.save(TKEY, d); }
  return d;
}
function renderTodo() {
  const d = todoState();
  $("#todo-count").textContent = `${d.done.length}/${d.items.length}`;
  $("#todo").innerHTML = d.items.map((t, i) => `<li class="${d.done.includes(t) ? "done" : ""}"><label><input type="checkbox" data-t="${i}" ${d.done.includes(t) ? "checked" : ""}><span>${esc(t)}</span><button type="button" data-tdel="${i}" title="Usuń zadanie" aria-label="Usuń zadanie">${xIcon}</button></label></li>`).join("");
}
$("#todo").addEventListener("change", (e) => { const d = todoState(), t = d.items[+e.target.dataset.t]; d.done = e.target.checked ? [...d.done, t] : d.done.filter((x) => x !== t); U.save(TKEY, d); renderTodo(); });
$("#todo").addEventListener("click", (e) => { const b = e.target.closest("[data-tdel]"); if (!b) return; e.preventDefault(); const d = todoState(); const t = d.items[+b.dataset.tdel]; d.items = d.items.filter((x) => x !== t); d.done = d.done.filter((x) => x !== t); U.save(TKEY, d); renderTodo(); });
$("#todo-add").addEventListener("submit", (e) => { e.preventDefault(); const t = e.target.t.value.trim(); if (!t) return; const d = todoState(); if (!d.items.includes(t)) d.items.push(t); U.save(TKEY, d); e.target.t.value = ""; renderTodo(); });
renderTodo(); setInterval(renderTodo, 60000);
/* kalendarz: zarobek, godziny gry i akcje ekipy z każdego dnia */
let calOff = 0;
function renderCal() {
  const base = new Date(); base.setDate(1); base.setHours(0, 0, 0, 0); base.setMonth(base.getMonth() + calOff);
  const y = base.getFullYear(), m = base.getMonth(), days = new Date(y, m + 1, 0).getDate(), lead = (base.getDay() + 6) % 7, today = dayStart(Date.now());
  $("#cal-m").textContent = base.toLocaleDateString("pl-PL", { month: "long", year: "numeric" });
  const earn = U.load("majestic-zarobki-v1", []), ev = U.load("majestic-ekipa-v1", { events: [] }).events || [];
  let html = ["pn", "wt", "śr", "cz", "pt", "sb", "nd"].map((d) => `<b>${d}</b>`).join("") + "<span></span>".repeat(lead);
  for (let d = 1; d <= days; d++) {
    const a = new Date(y, m, d).getTime(), z = a + DAY;
    const net = earn.filter((l) => l.at >= a && l.at < z).reduce((s, l) => s + l.amt, 0);
    const h = sessions ? sessions.filter((s) => s.connected && s.joined >= a && s.joined < z).reduce((s, x) => s + x.played, 0) / 3600 : 0;
    const e = ev.filter((x) => x.at >= a && x.at < z);
    const tip = [net ? "zarobek " + money(net) : "", h ? h.toFixed(1) + " h gry" : "", ...e.map((x) => "akcja: " + x.title)].filter(Boolean).join("\n");
    html += `<div class="cd ${a === today ? "now" : ""} ${h ? "pl" : ""}" title="${esc(tip)}"><i>${d}</i>${net ? `<small class="${net >= 0 ? "g" : "r"}">${Math.abs(net) >= 1000 ? Math.round(net / 1000) + "k" : net}</small>` : ""}${e.length ? `<em>${e.length}</em>` : ""}</div>`;
  }
  $("#cal").innerHTML = html;
}
$("#cal-p").addEventListener("click", () => { calOff--; renderCal(); });
$("#cal-n").addEventListener("click", () => { calOff++; renderCal(); });
$("#rep-img").addEventListener("click", async () => {
  const ws = dayStart(Date.now()) - ((new Date().getDay() + 6) % 7) * DAY;
  const ss = (sessions || []).filter((s) => s.connected && s.joined >= ws), h = ss.reduce((a, s) => a + s.played, 0) / 3600;
  const earn = U.load("majestic-zarobki-v1", []).filter((l) => l.at >= ws), net = earn.reduce((a, l) => a + l.amt, 0);
  const jobs = {}; earn.filter((l) => l.amt > 0).forEach((l) => (jobs[l.job] = (jobs[l.job] || 0) + l.amt));
  const best = Object.entries(jobs).sort((a, b) => b[1] - a[1]).slice(0, 3);
  const W = 800, H = 420, c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d"), css = getComputedStyle(document.documentElement), v = (k, d) => css.getPropertyValue(k).trim() || d;
  g.fillStyle = v("--bg-2", "#0b1428"); g.fillRect(0, 0, W, H); g.fillStyle = v("--accent", "#2563eb"); g.fillRect(0, 0, W, 56);
  g.fillStyle = v("--accent-ink", "#fff"); g.font = "bold 24px Bahnschrift, Segoe UI"; g.fillText("RAPORT TYGODNIA · MAJESTIC RP", 28, 37);
  g.font = "15px Segoe UI"; g.textAlign = "right"; g.fillText(new Date(ws).toLocaleDateString("pl-PL", { day: "numeric", month: "short" }) + " – " + new Date().toLocaleDateString("pl-PL", { day: "numeric", month: "short" }), W - 28, 36); g.textAlign = "left";
  const kpi = (x, label, val, col) => { g.fillStyle = v("--text-3", "#999"); g.font = "13px Segoe UI"; g.fillText(label.toUpperCase(), x, 100); g.fillStyle = col || v("--text", "#eee"); g.font = "bold 34px Bahnschrift, Segoe UI"; g.fillText(val, x, 140); };
  kpi(28, "Czas gry", h.toFixed(1) + " h"); kpi(240, "Na czysto", money(net), net >= 0 ? "#22c55e" : "#ef4444"); kpi(540, "Sesje", String(ss.length));
  g.fillStyle = v("--text-3", "#999"); g.font = "13px Segoe UI"; g.fillText("NAJLEPSZE PRACE", 28, 200);
  const max = best[0]?.[1] || 1;
  best.forEach(([j, a], i) => { const y = 222 + i * 52; g.fillStyle = v("--card-2", "#222"); g.fillRect(28, y, W - 56, 36); g.fillStyle = v("--accent", "#2563eb"); g.fillRect(28, y, (W - 56) * (a / max), 36); g.fillStyle = v("--text", "#eee"); g.font = "bold 16px Segoe UI"; g.fillText(j, 40, y + 24); g.textAlign = "right"; g.fillText(money(a), W - 40, y + 24); g.textAlign = "left"; });
  if (!best.length) { g.fillStyle = v("--text-2", "#bbb"); g.font = "16px Segoe UI"; g.fillText("Brak wpisów w Zarobkach w tym tygodniu.", 28, 240); }
  const url = c.toDataURL("image/png");
  if (!Host.available) { const a = document.createElement("a"); a.href = url; a.download = "raport.png"; return a.click(); }
  const r = await Host.call("copy_image", url, "raport");
  U.toast(r && r.path ? (r.copied ? "Raport w schowku: wklej go na Discordzie" : "Zapisano: " + r.path) : "Nie udało się zapisać");
});
renderCal();
function renderGoals() {
  const ws = dayStart(Date.now()) - ((new Date().getDay() + 6) % 7) * DAY;
  const g = { hours: 10, money: 500000, ...U.load("majestic-cele-v1", {}) };
  const h = sessions ? sessions.filter((s) => s.connected && s.joined >= ws).reduce((a, s) => a + s.played, 0) / 3600 : null;
  const m = U.load("majestic-zarobki-v1", []).filter((l) => l.at >= ws).reduce((a, l) => a + l.amt, 0);
  const row = (label, val, goal, fmt) => { const pct = goal ? Math.min(100, Math.max(0, (val / goal) * 100)) : 0;
    return `<div class="goal ${pct >= 100 ? "done" : ""}"><div class="goal-top"><span>${label}</span><b>${fmt(val)} <small>/ ${fmt(goal)}${pct >= 100 ? " · zrobione!" : ""}</small></b></div><div class="gbar"><i style="width:${pct}%"></i></div></div>`; };
  $("#goals").innerHTML = row("Czas gry", h ?? 0, g.hours, (v) => v.toFixed(1).replace(".", ",") + " h") + row("Zarobek na czysto", m, g.money, money)
    + `<small class="muted">Cele zmienisz w zakładce Statystyki. Po osiągnięciu dostaniesz powiadomienie.</small>`;
}
function renderNews() {
  const n = (live && live.news) || [];
  $("#news").innerHTML = n.map((x) => { const d = new Date(x.publishedAt); const fresh = Date.now() - d < 7 * DAY;
    return `<li><time>${d.toLocaleDateString("pl-PL", { day: "numeric", month: "short" })}</time><span>${esc(x.title)}${fresh ? `<small>nowe w tym tygodniu</small>` : ""}</span><span></span></li>`; }).join("")
    || `<li class="muted">Brak połączenia z serwerem Majestic.</li>`;
}
function renderSlow() {
  renderGoals();
  renderNews();
  if (sessions) {
    const today = dayStart(Date.now()), S = sessions.filter((s) => s.connected && s.joined >= today);
    $("#k-time").textContent = dur(S.reduce((a, s) => a + s.played, 0));
    $("#k-time-s").textContent = `${S.length} sesji dzisiaj`;
  }
  if (live && live.servers.length) {
    const s = live.servers.find((x) => x.id === myServer) || live.servers[0];
    $("#k-players").textContent = s.players;
    $("#k-players-s").textContent = `${s.name} · ${!s.status ? "offline" : s.techWorks ? "przerwa techniczna" : s.queuedPlayers ? "kolejka: " + s.queuedPlayers : "bez kolejki"}`;
  } else if (live) $("#k-players-s").textContent = "brak połączenia z serwerem Majestic";
}
async function loadSlow() {
  if (!Host.available) return;
  try { sessions = (await Host.call("sessions")).sessions; } catch {}
  renderCal();
  try { const st = await Host.call("get_settings"); if (st && st.server) myServer = String(st.server).toLowerCase(); } catch {}
  try { live = await Host.call("live"); } catch { live = { servers: [] }; }
  renderSlow();
}
document.querySelectorAll("[data-go]").forEach((b) => b.onclick = () => Host.nav(b.dataset.go));
$("#note-btn").onclick = () => Host.call("toggle_note");
$("#notes").addEventListener("click", (e) => {
  const b = e.target.closest("[data-del]"); if (!b) return;
  U.save("majestic-notatki-v1", U.load("majestic-notatki-v1", []).filter((n) => n.id !== b.dataset.del));
  renderNotes();
});
window.addEventListener("storage", () => { renderFast(); renderNotes(); });
renderFast(); renderNotes(); renderGoals(); loadSlow();
setInterval(renderNotes, 5000);
setInterval(renderFast, 1000); setInterval(loadSlow, 120000);
})();
</script>
</body>
</html>
