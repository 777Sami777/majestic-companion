<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Majestic Companion</title>
<link rel="stylesheet" href="shell.css">
</head>
<body>
<div id="intro" aria-hidden="true">
  <svg class="intro-logo" viewBox="0 0 64 64"><path class="il-a" d="M32 6 54 19v26L32 58 10 45V19z"/><path class="il-b" d="M22 40V24l10 9 10-9v16"/></svg>
  <div class="intro-word">MAJESTIC<span>MDT</span></div>
  <div class="intro-sub">Terminal gracza · łączenie</div>
  <div class="intro-bar"><i></i></div>
</div>

<header id="topbar" class="pywebview-drag-region">
  <div class="brand"><svg viewBox="0 0 64 64"><path d="M32 6 54 19v26L32 58 10 45V19z"/><path d="M22 40V24l10 9 10-9v16"/></svg><b>MAJESTIC <span>MDT</span></b></div>
  <div class="callsign"><span id="cs-code">MDT-01</span><b id="cs-name">Dziś</b></div>
  <div class="top-right">
    <div id="game" class="game off" role="status" title="Status gry"><i class="g-dot"></i><span class="g-code">10-7</span><span class="g-label">Poza służbą</span><b class="g-time"></b></div>
    <time class="clock" id="clock">--:--</time>
    <button class="icon-btn" id="fs-btn" title="Pełny ekran (F11)" aria-label="Pełny ekran"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <div class="win-ctl">
      <button id="w-min" title="Minimalizuj" aria-label="Minimalizuj"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button id="w-max" title="Maksymalizuj" aria-label="Maksymalizuj"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1"/></svg></button>
      <button id="w-close" class="close" title="Zamknij" aria-label="Zamknij"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </div>
</header>

<nav id="rail" aria-label="Moduły">
  <div class="tabs">
    <button class="tab on" data-mod="dzis" title="Dziś (Ctrl+1)"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 14h3v3H8z"/></svg><span>Dziś</span><kbd>1</kbd></button>
    <button class="tab" data-mod="mapa" title="Mapa (Ctrl+2)"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg><span>Mapa</span><kbd>2</kbd></button>
    <button class="tab" data-mod="kontakty" title="Kontakty (Ctrl+3)"><svg viewBox="0 0 24 24"><path d="M6 20c1-4 3.5-6 6-6s5 2 6 6M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg><span>Kontakty</span><kbd>3</kbd></button>
    <button class="tab" data-mod="sesje" title="Statystyki gry (Ctrl+4)"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Statystyki</span><kbd>4</kbd></button>
    <button class="tab" data-mod="minutniki" title="Minutniki (Ctrl+5)"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg><span>Minutniki</span><kbd>5</kbd></button>
    <button class="tab" data-mod="zarobki" title="Zarobki (Ctrl+6)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M14.5 9.5c-.5-1-1.5-1.5-2.5-1.5-1.4 0-2.5.8-2.5 2s1 1.7 2.5 2 2.5.8 2.5 2-1.1 2-2.5 2c-1 0-2-.5-2.5-1.5M12 6.5v11"/></svg><span>Zarobki</span><kbd>6</kbd></button>
    <button class="tab" data-mod="pojazdy" title="Rynek: pojazdy, nieruchomości, biznesy, tatuaże (Ctrl+7)"><svg viewBox="0 0 24 24"><path d="M5 16V11l2-5h10l2 5v5M3 16h18v3H3zM7 16v2M17 16v2M7.5 12.5h.01M16.5 12.5h.01"/></svg><span>Rynek</span><kbd>7</kbd></button>
    <button class="tab" data-mod="crafting" title="Crafting i kuchnia (Ctrl+8)"><svg viewBox="0 0 24 24"><path d="M4 11h16v2a8 8 0 0 1-16 0zM8 7c0-2 2-2 2-4M12 7c0-2 2-2 2-4M16 7c0-2 2-2 2-4"/></svg><span>Crafting</span><kbd>8</kbd></button>
    <button class="tab" data-mod="rp" title="Postać i RP: karta, teksty, dziennik, słownik (Ctrl+9)"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg><span>Postać i RP</span><kbd>9</kbd></button>
    <button class="tab" data-mod="ekipa" title="Ekipa: grafik, magazyn, raport (Ctrl+0)"><svg viewBox="0 0 24 24"><path d="M3 20c.8-3.5 3-5 6-5s5.2 1.5 6 5M9 12a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM16 5a3.5 3.5 0 0 1 0 7M18 15c2 .5 3 2 3.5 5"/></svg><span>Ekipa</span><kbd>0</kbd></button>
    <i class="tab-glider"></i>
  </div>
  <div class="rail-bottom">
    <button class="tab" data-mod="ustawienia" title="Ustawienia"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Ustawienia</span></button>
  </div>
</nav>

<main id="stage">
  <iframe id="f-dzis" class="mod on" data-src="dzis/index.html" title="Dziś"></iframe>
  <iframe id="f-mapa" class="mod" data-src="mapa/index.html" title="Mapa"></iframe>
  <iframe id="f-kontakty" class="mod" data-src="kontakty/index.html" title="Kontakty"></iframe>
  <iframe id="f-sesje" class="mod" data-src="sesje/index.html" title="Statystyki gry"></iframe>
  <iframe id="f-minutniki" class="mod" data-src="minutniki/index.html" title="Minutniki"></iframe>
  <iframe id="f-zarobki" class="mod" data-src="zarobki/index.html" title="Zarobki"></iframe>
  <iframe id="f-pojazdy" class="mod" data-src="pojazdy/index.html" title="Pojazdy"></iframe>
  <iframe id="f-crafting" class="mod" data-src="crafting/index.html" title="Crafting"></iframe>
  <iframe id="f-rp" class="mod" data-src="rp/index.html" title="Teksty RP"></iframe>
  <iframe id="f-ekipa" class="mod" data-src="ekipa/index.html" title="Ekipa"></iframe>
  <iframe id="f-ustawienia" class="mod" data-src="ustawienia/index.html" title="Ustawienia"></iframe>
</main>

<div id="search" hidden>
  <div class="s-box" role="dialog" aria-label="Szukaj w aplikacji">
    <div class="s-in"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="s-q" placeholder="Szukaj znaczników, kontaktów, notatek, tekstów RP…" autocomplete="off" aria-label="Szukaj"><kbd>Esc</kbd></div>
    <ul id="s-res" role="listbox"></ul>
  </div>
</div>
<div class="rz rz-r" data-rz="r"></div><div class="rz rz-b" data-rz="b"></div><div class="rz rz-l" data-rz="l"></div><div class="rz rz-rb" data-rz="rb"></div><div class="rz rz-lb" data-rz="lb"></div>

<script src="bridge.js"></script>
<script src="shell.js"></script>
</body>
</html>
