<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Majestic Kontakty</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="intro" aria-hidden="true">
  <div class="intro-ring"><svg viewBox="0 0 64 64"><circle class="ir-a" cx="32" cy="32" r="28"/><path class="ir-b" d="M22 44c1-6 5-9 10-9s9 3 10 9M32 31a6 6 0 1 0 0-12 6 6 0 0 0 0 12z"/></svg></div>
  <div class="intro-word">MAJESTIC<span>KONTAKTY</span></div>
</div>

<div class="app">
  <nav id="rail">
    <header class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24"><path d="M6 20c1-4 3.5-6 6-6s5 2 6 6M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg></div>
      <div><h1>Kontakty</h1><p id="count">0 osób</p></div>
    </header>

    <div class="money">
      <div class="money-row in"><span>Wiszą mi</span><b id="owed-in">$0</b></div>
      <div class="money-bar"><i id="bar-in"></i><i id="bar-out"></i></div>
      <div class="money-row out"><span>Ja wiszę</span><b id="owed-out">$0</b></div>
    </div>

    <h2>Widok</h2>
    <ul class="filters" id="views"></ul>
    <h2>Frakcje</h2>
    <ul class="filters" id="facs"></ul>

    <footer class="rail-foot">
      <button class="btn ghost" id="export-btn"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Eksport</button>
      <button class="btn ghost" id="import-btn"><svg viewBox="0 0 24 24"><path d="M12 20V9M7 14l5-5 5 5M5 4h14"/></svg>Import</button>
      <input type="file" id="import-file" accept=".json" hidden>
    </footer>
  </nav>

  <main id="list-col">
    <div class="list-head">
      <label class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Szukaj po imieniu, numerze, notatce…" autocomplete="off" spellcheck="false">
        <kbd>Ctrl K</kbd>
      </label>
      <button class="btn primary" id="add-btn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Nowy kontakt</button>
    </div>
    <div class="list-meta"><span id="list-title">Wszyscy</span><select id="sort" aria-label="Sortowanie">
      <option value="recent">Ostatnio dodani</option><option value="name">Alfabetycznie</option><option value="trust">Zaufanie</option><option value="debt">Długi</option>
    </select></div>
    <ul id="list"></ul>
  </main>

  <section id="detail"></section>
</div>

<div id="toasts" aria-live="polite"></div>
<script src="../bridge.js"></script>
<script src="app.js"></script>
</body>
</html>
